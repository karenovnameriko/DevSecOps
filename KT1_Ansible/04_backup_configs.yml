
---
# Backup configuration files on the target server
- name: Backup configuration files
  hosts: NGINX
  become: true

  tasks:
    # Create a directory for backup files
    - name: Create backup directory
      ansible.builtin.file:
        path: /opt/config-backups 
        state: directory   
        owner: root
        group: root
        mode: '0700'

    # Copy SSH configuration to the backup directory
    - name: Backup SSH configuration
      ansible.builtin.copy:
        src: /etc/ssh/sshd_config
        dest: /opt/config-backups/sshd_config
        remote_src: true
        mode: preserve

    # Copy Nginx configuration to the backup directory
    - name: Backup Nginx configuration
      ansible.builtin.copy:
        src: /etc/nginx/nginx.conf
        dest: /opt/config-backups/nginx.conf
        remote_src: true
        mode: preserve

