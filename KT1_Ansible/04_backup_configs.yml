
---
- name: Backup configuration files and directories
  hosts: NGINX
  become: true

  vars:
    backup_dir: /opt/config-backups

  tasks:
    - name: Create backup directory
      ansible.builtin.file:
        path: "{{ backup_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Backup configuration files and directories
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "{{ backup_dir }}/{{ item | basename }}"
        remote_src: true
        mode: preserve
      loop: "{{ backup_paths }}"

