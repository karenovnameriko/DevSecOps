---
- name: Manage system services
  hosts: NGINX
  become: true

  tasks:
    - name: Start service
      ansible.builtin.systemd_service:
        name: "{{ service }}"
        state: started
      when: action == "start"

    - name: Stop service
      ansible.builtin.systemd_service:
        name: "{{ service }}"
        state: stopped
      when: action == "stop"

    - name: Restart service
      ansible.builtin.systemd_service:
        name: "{{ service }}"
        state: restarted
      when: action == "restart"
