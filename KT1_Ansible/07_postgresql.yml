---
- name: Install and configure PostgreSQL
  hosts: NGINX
  become: true

  tasks:
    - name: Install PostgreSQL and Python driver
      ansible.builtin.apt:
        name:
          - postgresql
          - python3-psycopg2
        state: present
        update_cache: true

    - name: Start and enable PostgreSQL
      ansible.builtin.systemd_service:
        name: postgresql
        state: started
        enabled: true
