---
- name: Configure firewall
  hosts: NGINX
  become: true

  tasks:
    - name: Install UFW
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: true

    - name: Allow SSH connections
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp

    - name: Allow HTTP connections
      community.general.ufw:
        rule: allow
        port: '80'
        proto: tcp

    - name: Allow HTTPS connections
      community.general.ufw:
        rule: allow
        port: '443'
        proto: tcp

    - name: Set default incoming policy
      community.general.ufw:
        direction: incoming
        policy: deny

    - name: Set default outgoing policy
      community.general.ufw:
        direction: outgoing
        policy: allow

    - name: Enable UFW
      community.general.ufw:
        state: enabled
